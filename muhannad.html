<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رصيدك</title>
<style>
  :root{
    --bg:#0d1210; --panel:#12181a; --line:#223028;
    --ink:#eef4f1; --ink-dim:#8a9d95;
    --insta:#a855f7; --voda:#f43f5e; --fee:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:440px}

  .head{text-align:center;margin-bottom:26px}
  .head h1{font-size:19px;margin:0 0 4px;font-weight:800}
  .head p{margin:0;font-size:14.5px;color:#c7d2cd;font-weight:600;line-height:1.6}
  .card.total{border-top-color:#fbbf24;background:linear-gradient(180deg,rgba(251,191,36,.05),transparent 60%),var(--panel)}
  .card.total .name i{background:#fbbf24}
  .card.total .val{color:#fbbf24}
  .card.total .copy{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:#fbbf24}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px;margin-bottom:12px;border-top:3px solid var(--line)}
  .card.voda{border-top-color:var(--voda)}
  .card.insta{border-top-color:var(--insta)}
  .name{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;margin-bottom:10px}
  .name i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .card.voda .name i{background:var(--voda)} .card.insta .name i{background:var(--insta)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .val{font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:42px;line-height:1.1;
    color:var(--fee);direction:ltr;text-align:right;flex:1}
  .copy{flex-shrink:0;width:38px;height:38px;border-radius:10px;cursor:pointer;
    background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.35);color:var(--fee);
    font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
    font-family:inherit;transition:.15s}
  .copy:active{transform:scale(.93)}
  .copy.done{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.5);color:#4ade80}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
    background:#1b2a22;border:1px solid rgba(74,222,128,.4);color:#7dd3a8;
    padding:11px 22px;border-radius:11px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .foot{text-align:center;margin-top:20px;font-size:12px;color:var(--ink-dim)}
  .refresh{margin-top:12px;padding:9px 22px;border-radius:9px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
    font-family:inherit;font-size:13px}
  .refresh:active{transform:translateY(1px)}
  .loading .val{color:var(--ink-dim);font-size:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>رصيدك عند سالم</h1>
    <p id="stamp">بيحمّل…</p>
  </div>

  <div class="card voda loading" id="cardVoda">
    <div class="name"><i></i>فودافون</div>
    <div class="row">
      <div class="val" id="valVoda">—</div>
      <button class="copy" data-copy="Voda" title="نسخ الرقم">⧉</button>
    </div>
  </div>

  <div class="card insta loading" id="cardInsta">
    <div class="name"><i></i>إنستا</div>
    <div class="row">
      <div class="val" id="valInsta">—</div>
      <button class="copy" data-copy="Insta" title="نسخ الرقم">⧉</button>
    </div>
  </div>

  <div class="card total loading" id="cardTotal">
    <div class="name"><i></i>المجموع</div>
    <div class="row">
      <div class="val" id="valTotal">—</div>
      <button class="copy" data-copy="Total" title="نسخ الرقم">⧉</button>
    </div>
  </div>

  <div class="foot">
    <button class="refresh" id="refreshBtn">تحديث</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});

  const SB_URL='https://ziehhwdphavnbmltxnmc.supabase.co';
  const SB_KEY='sb_publishable_RFIqrEl890V6fHaVItigUw_pYYibXg6';
  const SB_TABLE='ghazal_mini_state';
  const SB_ROW='main';

  function mineOf(ptxns, wallet){
    let n=0;
    for(const p of (ptxns||[])){ if(p.wallet!==wallet)continue; n += p.kind==='spend' ? -p.amt : p.amt; }
    return n;
  }

  function show(data, updatedAt){
    let sum=0;
    ['فودافون','إنستا'].forEach(w=>{
      const total=+(data.totals&&data.totals[w])||0;
      const muh=Math.max(0, total-Math.max(0, mineOf(data.ptxns, w)));
      sum+=muh;
      const id = w==='فودافون' ? 'Voda' : 'Insta';
      $('val'+id).textContent=fmt(muh);
      $('card'+id).classList.remove('loading');
    });
    $('valTotal').textContent=fmt(sum);
    $('cardTotal').classList.remove('loading');
    if(updatedAt){
      const d=new Date(updatedAt);
      let h=d.getHours(); h=h%12; if(h===0)h=12;
      $('stamp').textContent='آخر تحديث '+String(d.getDate()).padStart(2,'0')+'/'+
        String(d.getMonth()+1).padStart(2,'0')+'  ·  '+h+':'+String(d.getMinutes()).padStart(2,'0');
    }
  }

  function load(){
    $('stamp').textContent='بيحمّل…';
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW+'&select=data,updated_at',{
      signal:ctrl.signal, cache:'no-store',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    }).then(r=>r.json()).then(rows=>{
      clearTimeout(t);
      const row=rows&&rows[0];
      if(row&&row.data){
        show(row.data, row.updated_at);
        try{localStorage.setItem('muh_view_cache',JSON.stringify(row));}catch(e){}
      } else {
        $('stamp').textContent='ما في بيانات لسه';
      }
    }).catch(()=>{
      clearTimeout(t);
      // بلا نت: نعرض آخر نسخة محفوظة
      try{
        const c=JSON.parse(localStorage.getItem('muh_view_cache'));
        if(c&&c.data){ show(c.data, c.updated_at); $('stamp').textContent+=' (بدون نت)'; return; }
      }catch(e){}
      $('stamp').textContent='ما قدرت أحمّل — تأكد من النت';
    });
  }

  let toastTimer=null;
  function showToast(msg){
    const el=$('toast');
    el.textContent=msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
  }

  // نسخ الرقم من كل كارت لحاله
  document.querySelectorAll('.copy').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const txt=$('val'+btn.dataset.copy).textContent.trim();
      if(!txt||txt==='—')return;
      const done=()=>{ btn.textContent='✓'; btn.classList.add('done');
        showToast('تم نسخ الرقم');
        setTimeout(()=>{ btn.textContent='⧉'; btn.classList.remove('done'); },1400); };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(()=>{
          const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');done();}catch(_){} ta.remove();
        });
      } else {
        const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');done();}catch(_){} ta.remove();
      }
    });
  });

  $('refreshBtn').addEventListener('click',load);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
  window.addEventListener('online', load);
  load();
})();
</script>
</body>
</html>
